<div class="auth-shell">
  <div class="auth-shell__inner">

      <span class="auth-shell__logo">
        <svg lucideZap></svg>
      </span>
      <span class="auth-shell__brand-name">Nexus</span>

    <div class="auth-shell__card">

      <div class="auth-shell__content">
        <ng-content />

    </div>
  </div>
</div>
